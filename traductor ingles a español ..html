<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traductor a Inglés</title>
</head>
<body style="font-family:Arial; background:#f2f2f2; text-align:center; padding:30px;">

<h1 style="color:#004AAD; margin-bottom:20px;">TRADUCTOR A INGLÉS</h1>

<input type="text" id="busqueda" placeholder="Escribe en español..." 
style="padding:15px; width:90%; max-width:400px; font-size:18px; border:2px solid #004AAD; border-radius:10px;">

<div id="resultado" style="margin-top:30px; background:white; padding:20px; border-radius:10px; max-width:400px; margin-left:auto; margin-right:auto; font-size:22px; min-height:30px; color:#333;">
</div>

<script>
const input = document.getElementById('busqueda');
const res = document.getElementById('resultado');

input.addEventListener('input', async () => {
  let texto = input.value.trim();
  if (texto.length < 1) { res.innerHTML = ""; return; }
  
  res.innerHTML = "Traduciendo...";
  
  try {
    let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=es|en`;
    let r = await fetch(url);
    let data = await r.json();
    res.innerHTML = `<b style="color:#004AAD;">${data.responseData.translatedText}</b>`;
  } catch (e) {
    res.innerHTML = "Error de conexión";
  }
});
</script>

</body>
</html>
